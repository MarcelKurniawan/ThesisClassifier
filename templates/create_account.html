<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" crossorigin="anonymous">

    <title>Register with us</title>
    <style>
        body, html {
            background-image: url("/static/img/background.jpg");
            background-color: #cccccc;
            height: 100%;
            color: white;
        }
        .form-container {
            background: rgba(0, 0, 0, 0.5); /* Add a background to make text readable on any image */
            padding: 30px;
            border-radius: 10px;
        }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand">Thesis Topic Prediction</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </nav>

    <div class="container-fluid h-100">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col col-sm-6 col-md-6 col-lg-4 col-xl-3 form-container">
                {% if exist_message %}
                <div class="alert alert-danger">
                    <center>{{ exist_message }}</center>
                </div>
                {% endif %}
                <form action="/create_account" method="post">
                    <h2 class="text-center">Sign Up</h2>
                    <div class="form-group">
                        <input _ngcontent-c0="" class="form-control form-control-lg" name="name" placeholder="Nama" type="text" required>
                    </div>
                    <div class="form-group">
                        <input 
                            class="form-control form-control-lg" 
                            name="student_id" 
                            placeholder="NIM" 
                            type="text" 
                            pattern="^\d{10}$" 
                            title="NIM harus terdiri dari 10 angka" 
                            required>
                    </div>
                    <div class="form-group">
                        <input _ngcontent-c0="" class="form-control form-control-lg" name="user_email" placeholder="Email" type="email" required>
                    </div>
                    <div class="form-group">
                        <input class="form-control form-control-lg" id="txtNewPassword" name="user_pwd0" placeholder="Password" type="password" required>
                    </div>
                    <div class="form-group">
                        <input class="form-control form-control-lg" id="txtConfirmPassword" name="user_pwd1" placeholder="Confirm password" type="password" required>
                    </div>
                    <div class="registrationFormAlert" id="divCheckPasswordMatch"></div>
                    <div class="form-group">
                        <button class="btn btn-info btn-lg btn-block">Register</button>
                    </div>
                    <div class="text-center">
                        <p>Already have an account? <a href="/authenticate" class="text-info">Click here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" crossorigin="anonymous"></script>
  </body>
</html>
