<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submitted Results</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body, html {
            height: 100%;
            color: #333;
        }
        .table-responsive {
            overflow-x: auto;
        }
        .data-label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand">Topic Prediction</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/homepage_admin">Predictor</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/approval_page">Approval</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/results">Results</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/spv_list_admin">Spv List</a>
                </li>
            </ul>
            <form class="form-inline my-2 my-lg-0 ml-auto" action="/logout" method="post" onsubmit="return confirmLogout();">
                <button class="btn btn-danger my-2 my-sm-0" type="submit">Logout</button>
            </form>
        </div>
    </nav>

    <div class="container">
        <h1 class="mt-5">Submitted Results</h1>
        <div class="d-flex justify-content-end mb-2">
            <select id="sortOrder" class="custom-select w-auto">
                <option value="default">Sort</option>
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
            </select>
        </div>
        <div class="table-responsive">
            <table class="table mt-4">
                <tbody id="resultsTable">
                    {% for row in rows %}
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">No</td>
                        <td class="data-id">{{ row[0] }}</td>
                    </tr>
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">Title</td>
                        <td>{{ row[1] }}</td>
                    </tr>
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">Abstract</td>
                        <td>{{ row[2] }}</td>
                    </tr>
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">Supervisor</td>
                        <td>{{ row[3] }}</td>
                    </tr>
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">SpvID</td>
                        <td>{{ row[4] }}</td>
                    </tr>
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">Topic</td>
                        <td>{{ row[5] }}</td>
                    </tr>
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">Status</td>
                        <td>{{ row[6] }}</td>
                    </tr>
                    <tr class="data-row" data-id="{{ row[0] }}">
                        <td class="data-label">Reason</td>
                        <td>{{ row[7] }}</td>
                    </tr>
                    <tr class="data-separator" data-id="{{ row[0] }}"><td colspan="2"><hr style="border-top: 3px solid black;"></td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="text-right mb-4">
            <a href="/generate_csv" class="btn btn-primary mt-3">Download CSV</a>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js" integrity="sha384-OgVRvuATP1z7JjHLkuOU7Xw704+h835Lr+6QL9UvYjZE3Ipu6Tp75j7Bh/kR0JKI" crossorigin="anonymous"></script>
    <script>
        document.getElementById('sortOrder').addEventListener('change', function() {
            sortTable(this.value);
        });

        function sortTable(order) {
            var table = document.getElementById('resultsTable');
            var rows = Array.from(table.getElementsByTagName('tr'));

            var groupedRows = [];
            var currentGroup = [];

            rows.forEach(function(row) {
                if (row.classList.contains('data-separator')) {
                    currentGroup.push(row);
                    groupedRows.push(currentGroup);
                    currentGroup = [];
                } else {
                    currentGroup.push(row);
                }
            });

            groupedRows.sort(function(a, b) {
                var idA = parseInt(a[0].getAttribute('data-id'));
                var idB = parseInt(b[0].getAttribute('data-id'));

                if (order === 'asc') {
                    return idA - idB;
                } else if (order === 'desc') {
                    return idB - idA;
                } else {
                    return 0; // Default sorting
                }
            });

            groupedRows.forEach(function(group) {
                group.forEach(function(row) {
                    table.appendChild(row);
                });
            });
        }

        function confirmLogout() {
            return confirm('Do you want to log out?');
        }
    </script>
</body>
</html>
